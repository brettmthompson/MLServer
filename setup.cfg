[flake8]
max-line-length = 88
extend-ignore =
  # See https://github.com/PyCQA/pycodestyle/issues/373
  E203,
per-file-ignores =
  # HTML/SVG template generators — indentation and line length inside
  # f-string templates do not follow Python conventions.
  docs/diagrams/build_*.py: E122, E501
  # Manim scripts use `from manim import *` by convention.
  docs/diagrams/inference_flow_animation.py: F403, F405
exclude =
  # Generated gRPC code
  ./mlserver/grpc/dataplane_pb2*
  ./mlserver/grpc/model_repository_pb2*
  ./mlserver.egg-info
  ./.mypy_cache
  ./.git
  ./.tox
  ./**/.tox
  ./dist
  ./**/dist
  ./venv
  ./**/venv
  ./.venv
  ./**/.venv
