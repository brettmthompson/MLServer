name: Create Tag and Release with Changelog

on:
  workflow_dispatch:
    inputs:
      tag_name: # The new release tag to be created and used as the search value.
        description: 'New release tag (e.g., odh-v2.35)'
        required: true
        type: string
      next_tag_name: # The next tag to replace the current one in the Konflux files.
        description: 'Next development cycle tag: (e.g., odh-v2.36)'
        required: true
        type: string
    #
    # Note: This workflow assumes the release tag and image tags are in sync.
    #       'tag_name' is used to create the release and as the value to find in konflux files.
    #       'next_tag_name' provides the new value to set.
    #

permissions:
  contents: write
  packages: write
  pull-requests: write
  
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'release-')
    steps:
      - name: Validate tag format
        run: |
          CURRENT_TAG="${{ github.event.inputs.tag_name }}"
          NEXT_TAG="${{ github.event.inputs.next_tag_name }}"

          # Validate tag format
          if [[ ! "$CURRENT_TAG" =~ ^odh-v[0-9]+\.[0-9]+$ ]]; then
            echo "Error: CURRENT_TAG format invalid: $CURRENT_TAG (expected format: odh-vX.Y, e.g., odh-v2.35)"
            exit 1
          fi
          if [[ ! "$NEXT_TAG" =~ ^odh-v[0-9]+\.[0-9]+$ ]]; then
            echo "Error: NEXT_TAG format invalid: $NEXT_TAG (expected format: odh-vX.Y, e.g., odh-v2.36)"
            exit 1
          fi   
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validate current tag presence in mlserver-push.yaml
        run: |
          if [[ ! -f .tekton/mlserver-push.yaml ]]; then
            echo "Error: .tekton/mlserver-push.yaml not found"
            exit 1
          fi
          if ! grep -q "mlserver:${CURRENT_TAG}" .tekton/mlserver-push.yaml; then
            echo "Error: Tag ${CURRENT_TAG} not found in .tekton/mlserver-push.yaml"
            exit 1
          fi

  fetch-tag:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Get latest tag
        id: get_tag
        run: |
          echo "old_tag_name=$(git for-each-ref --sort=creatordate --format '%(refname)' refs/tags  | awk -F'/' '{print $3}' | tail -n1)" >> $GITHUB_OUTPUT
      - name: Print tags
        run: | 
          echo "Old Tag=${{ steps.get_tag.outputs.old_tag_name }}"
          echo "New Tag=${{ github.event.inputs.tag_name }}"
          echo "Next Tag=${{ github.event.inputs.next_tag_name }}"
          echo "$(basename ${{ github.ref }})"
      - name: Check if tag exists
        run: |
            import sys
            import subprocess
            tag_name = "${{ github.event.inputs.tag_name }}"
            command = ['git', 'tag', '-l', tag_name]
            output = subprocess.check_output(command, stderr=subprocess.STDOUT)
            if output.decode() != "":
                print(f"Error: Tag '{tag_name}' already exists.", file=sys.stderr)
                sys.exit(1)
            else:
                print(f"Tag '{tag_name}' does not exist.")
        shell: python
        continue-on-error: false

  create-tag:
    runs-on: ubuntu-latest
    needs: fetch-tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Create Tag
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git tag -a ${{ github.event.inputs.tag_name }} -m "Release ${{ github.event.inputs.tag_name }}"
          git push origin ${{ github.event.inputs.tag_name }}
  
  bump-tag: 
    runs-on: ubuntu-latest
    needs: create-tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Update mlserver-push.yaml with next tag
        run: |
          CURRENT_TAG="${{ github.event.inputs.tag_name }}"
          NEXT_TAG="${{ github.event.inputs.next_tag_name }}"
          
          echo "Updating mlserver image tag from $CURRENT_TAG to $NEXT_TAG in .tekton/mlserver-push.yaml..."

          sed -i "s|mlserver:${CURRENT_TAG}|mlserver:${NEXT_TAG}|g" .tekton/mlserver-push.yaml

          echo "Update complete."
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if there are any changes to commit
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit. Exiting."
          else
            git config --global user.email "github-actions@github.com"
            git config --global user.name "GitHub Actions"

            # Create a new branch for the PR
            BRANCH_NAME="bump-tag-${{ github.event.inputs.next_tag_name }}"
            git checkout -b "$BRANCH_NAME"

            # Stage and commit changes
            git add .tekton/mlserver-push.yaml
            git commit -m "chore(konflux): Bump release tag to ${{ github.event.inputs.next_tag_name }}"
            git push -u origin "$BRANCH_NAME"

            # Create pull request using GitHub CLI
            gh pr create \
              --title "chore(konflux): Bump release tag to ${{ github.event.inputs.next_tag_name }}" \
              --body "$(cat <<'EOF'
          ## Description
          - Updated image tag reference in Konflux configuration
          - Part of the release preparation workflow for ${{ github.event.inputs.tag_name }}

          ## Changes
          - Release tag updated from `${{ github.event.inputs.tag_name }}` to `${{ github.event.inputs.next_tag_name }}` in `.tekton/mlserver-push.yaml`

          🤖 Generated with GitHub Actions
          EOF
          )" \
              --base ${{ github.ref_name }} \
              --head "$BRANCH_NAME"
          fi